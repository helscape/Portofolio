<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}} — Fabian Aprilliano</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<link rel="alternate" type="application/rss+xml" title="Fabian Aprilliano — blog" href="/blog/feed.xml">
<meta property="og:type" content="{{type}}">
<meta property="og:site_name" content="Fabian Aprilliano">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="article:published_time" content="{{isoDate}}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="theme-color" content="#faf9f5">
<script>
(function(){
  try{
    var t = localStorage.getItem('theme');
    var d = matchMedia('(prefers-color-scheme:dark)').matches;
    document.documentElement.dataset.theme = t || (d ? 'dark' : 'light');
  }catch(e){ document.documentElement.dataset.theme = 'light'; }
})();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b45309'/%3E%3Ctext x='16' y='22' font-family='ui-monospace,monospace' font-size='17' font-weight='700' fill='%23fff' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/main.css">
{{mathStyle}}
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="name">Fabian Aprilliano</span>
      <span class="sep">/</span>
      <span class="handle">helscape</span><span class="cursor" aria-hidden="true">_</span>
    </div>
    <nav class="nav">
      <a href="/blog/">← blog</a>
      <button class="toggle" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle theme">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </nav>
  </div>
</header>

<main>

<article class="post">
  <header class="post-head">
    <h1>{{title}}</h1>
    <p class="post-meta"><time datetime="{{isoDate}}">{{date}}</time></p>
  </header>

  <div class="prose">
{{content}}
  </div>
</article>

<section class="comments" id="comments" data-slug="{{slug}}">
  <h2>Comments</h2>

  <ol class="comment-list" data-comment-list></ol>
  <p class="comments-empty" data-comment-empty hidden>No comments yet. Say something.</p>

  <form class="comment-form" data-comment-form>
    <p class="reply-to" data-reply-to hidden>
      Replying to <span data-reply-name></span>
      <button type="button" data-reply-cancel>cancel</button>
    </p>
    <input type="hidden" name="parentId" value="">

    <div class="field">
      <label for="c-author">Name</label>
      <input id="c-author" name="author" type="text" maxlength="80" required autocomplete="name">
    </div>
    <div class="field">
      <label for="c-body">Comment</label>
      <textarea id="c-body" name="body" rows="4" maxlength="2000" required></textarea>
    </div>
    <!-- honeypot: hidden from people, tempting to bots -->
    <div class="hp" aria-hidden="true">
      <label for="c-website">Website</label>
      <input id="c-website" name="website" type="text" tabindex="-1" autocomplete="off">
    </div>
    <button type="submit">Post comment</button>
    <p class="form-status" data-comment-status role="status"></p>
  </form>
</section>

<footer>
  <span>Fabian Aprilliano Ekaputra</span>
  <span>Bogor, Indonesia</span>
</footer>

</main>

<script src="/assets/theme.js"></script>
<script src="/assets/comments.js"></script>
</body>
</html>
